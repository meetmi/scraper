        appInsights.addTelemetryInitializer(function (envelope) {
            envelope.tags["ai.cloud.role"] = "Portal";

            function setOperationName() {
                envelope.tags["ai.operation.name"] = "Search\\Index";
            }

            function setDisplayMode(data) {
                data["displayMode"] = "Desktop";
            }

            if (envelope.baseType == "PageviewData" && firstPageView) {
                setOperationName();
                setDisplayMode(envelope.data);
                firstPageView = false;
            }

            if (envelope.baseType == "MetricData" || envelope.baseType == "PageviewPerformanceData") {
                setOperationName();

                const data = envelope.data;
                setDisplayMode(data);

                    try {
                        const scriptEntries = window.performance
                            .getEntries()
                            .filter(entry => entry instanceof PerformanceResourceTiming)
                            .filter(e => e.initiatorType === 'script');

                        const ourScripts = scriptEntries.filter(item => item.name.startsWith(window.location.origin));
                        const thirdPartyScripts = scriptEntries.filter(item => !item.name.startsWith(window.location.origin));

                        data["autoTraderScriptTransferSize"] = ourScripts.map(item => item.transferSize).reduce((a, b) => a + b, 0);
                        data["autoTraderScriptDuration"] = ourScripts.map(item => item.duration).reduce((a, b) => a + b, 0);
                        data["autoTraderScriptCount"] = ourScripts.length;

                        data["thirdPartyScriptTransferSize"] = thirdPartyScripts.map(item => item.transferSize).reduce((a, b) => a + b, 0);
                        data["thirdPartyScriptDuration"] = thirdPartyScripts.map(item => item.duration).reduce((a, b) => a + b, 0);
                        data["thirdPartyScriptCount"] = thirdPartyScripts.length;
                    }
                    catch (e) {
                        console.error(e);
                    }
                    firstPageViewPerformance = false;
                }
            }
